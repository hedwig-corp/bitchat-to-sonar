[package]
name = "sonar-sim"
description = "Multi-agent Marmot/MLS swarm simulation: find the real group-size ceiling and protocol bugs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sonar-sim"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage", "env"] }
hex.workspace = true
nostr.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde.workspace = true
serde_json.workspace = true
sonar-core = { path = "../sonar-core" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
