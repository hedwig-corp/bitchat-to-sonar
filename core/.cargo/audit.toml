# cargo-audit configuration. Read automatically when cargo-audit runs from
# `core/` (its config lookup is relative to the working directory), so:
#
#     cd core && cargo audit
#
# Every ignore below is justified by a reachability analysis in
# docs/SECURITY-ADVISORIES.md. Ignores are per-advisory-ID, so a NEW advisory
# against the same crate still fails the audit — do not widen these to crate
# level. Re-validate whenever the MDK/openmls/hpke-rs or iroh pins move.
#
# The libcrux ignores (0124, 0207, 0208, 0209, 0211, 0212) were removed with the
# MDK v0.10.4 bump: since the MDK 0.9 port the lockfile carries patched libcrux
# (hpke-rs 0.7.0, libcrux-sha3 0.0.10, libcrux-secrets 0.0.6), so they no longer
# match, and a stale ignore would hide a regression to a vulnerable version.

[advisories]
ignore = [
    # quick-xml enters only through plist (via netdev/netwatch/iroh) and does not
    # resolve for any shipped target — iOS, Android, or macOS.
    "RUSTSEC-2026-0194", # quick-xml: patched in >= 0.41.0
    "RUSTSEC-2026-0195", # quick-xml: patched in >= 0.41.0
]
