[workspace]
resolver = "2"
members = ["bitchat-protocol", "sonar-core", "sonar-ffi", "sonar-cli", "sonar-stickers", "sonar-status", "sonar-sim", "sonar-wallet", "sonar-wallet-cdk"]
# Excluded sub-trees, each its own build island so the default `cargo test
# --workspace` (CI) never touches them:
#  - vendor/iroh-roq: vendored, iroh-1.0-ported RTP-over-QUIC media layer, a
#    `calls`-feature path dep of sonar-core (see sonar-core/Cargo.toml).
#  - sonar-ble: the desktop BLE bridge (own [workspace]) so its
#    btleplug/CoreBluetooth deps stay out of this workspace.
#  - sonar-wallet-breez: Breez SDK Liquid implementation of the sonar-wallet
#    interface. MUST stay an island: breez-sdk-liquid ships a forked
#    libsqlite3-sys 0.36 (`links = "sqlite3"`, plain bundled SQLite) that
#    cannot coexist in one cargo graph with the workspace's SQLCipher
#    libsqlite3-sys (via storage-sqlite / rusqlite 0.40) — and linking both into
#    one binary would recreate the SQLCipher symbol-shadowing bug that once
#    broke iOS Marmot encryption.
#  - vendor/breez-sdk: sdk-common/sdk-macros, vendored because upstream deleted
#    github.com/breez/breez-sdk (see vendor/breez-sdk/VENDORED.md). Belongs to
#    the Breez island for the same reason as above — sdk-common's workspace
#    pins rusqlite with `bundled` (plain SQLite), so letting this workspace
#    absorb it would reintroduce the SQLCipher shadowing risk. It has its own
#    [workspace] root; without this exclude, cargo resolves these crates
#    against THIS manifest and fails to inherit their workspace deps.
#  - vendor/breez-sdk-liquid: the breez-sdk-liquid crate itself, vendored when
#    its upstream repo was re-created empty (2026-09-20). Same island, same
#    reasons.
exclude = ["vendor/iroh-roq", "sonar-ble", "sonar-wallet-breez", "vendor/breez-sdk", "vendor/breez-sdk-liquid"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

# Size-optimized release builds (the staticlib ships inside the iOS app).
# Kept in the profile (not RUSTFLAGS): `-C lto` via RUSTFLAGS clashes with
# cargo's `-C embed-bitcode=no` default for dependency crates.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1

[workspace.dependencies]
# MDK v0.14.0 (commit 3fb4b475, tag v0.14.0, 2026-10-23): the latest stable
# MDK release. Upstream deleted the 0.8 crates (`mdk-core` /
# `mdk-sqlite-storage` / `mdk-memory-storage` / `mdk-storage-traits`) and split
# the workspace into `cgka-engine` / `cgka-session` / `storage-sqlite` /
# `transport-nostr-peeler`. Wire format is Marmot `0xf2f1` — NOT
# byte-compatible with the 0.8 `e8cd584` / `0xf2ee` pin Sonar shipped before
# ("v1"). Existing v1 chats are decrypted and moved into their v2 successor
# by `sonar-core/src/mdk08_migrate.rs`; see
# `docs/plans/2026-09-13-mdk-09-existing-chat-migration.md`.
# Bump checklist (CLAUDE.md): run `sonar-sim group-scale` and diff
# docs/GROUP-SCALE-SIM.md, and re-check MDK's RESERVED_APP_EVENT_KINDS
# (`timezone.rs` tests) against White Noise.
cgka-traits = { git = "https://github.com/marmot-protocol/mdk", rev = "3fb4b4759ac676b0c21c4c3527074866c9fa4c89" }
cgka-engine = { git = "https://github.com/marmot-protocol/mdk", rev = "3fb4b4759ac676b0c21c4c3527074866c9fa4c89" }
cgka-session = { git = "https://github.com/marmot-protocol/mdk", rev = "3fb4b4759ac676b0c21c4c3527074866c9fa4c89" }
storage-sqlite = { git = "https://github.com/marmot-protocol/mdk", rev = "3fb4b4759ac676b0c21c4c3527074866c9fa4c89" }
transport-nostr-peeler = { git = "https://github.com/marmot-protocol/mdk", rev = "3fb4b4759ac676b0c21c4c3527074866c9fa4c89" }
nostr = { version = "0.44", features = ["std", "nip44", "nip59"] }
# Since MDK v0.11 the protocol crates build on a rust-nostr fork (0.45-dev).
# Only `transport-nostr-peeler` and the account-identity proof take nostr types,
# so sonar-core keeps crates.io 0.44 (with nostr-sdk, nostr-blossom and the
# relay builder) and bridges at that seam (`sonar-core/src/mdk_nostr.rs`).
# Keep this rev equal to MDK's own `nostr` pin.
nostr-mdk = { package = "nostr", git = "https://github.com/erskingardner/rust-nostr", rev = "48801bf6f2f1cd55bb1729e94159946c8832a786", default-features = false, features = ["std", "rand", "os-rng", "nip04", "nip49", "nip59"] }
nostr-sdk = "0.44"
nostr-relay-builder = "0.44"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.20"

# Accept HTTP 201 Created from Blossom servers (e.g. nostr.download) until upstream
# nostr-blossom includes the same status handling.
# hax-lib-macros: copied from MDK so the OpenMLS/libcrux path builds.
[patch.crates-io]
nostr-blossom = { path = "vendor/nostr-blossom" }
hax-lib-macros = { git = "https://github.com/cryspen/hax.git", rev = "8f9cb576e58f6cc7e9ed249a7d4439b0f7ed0da7" }
