[package]
name = "sonar-wallet-cdk"
description = "Cashu (CDK) implementation of the sonar-wallet interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# A normal workspace member, unlike sonar-wallet-breez: the cdk + cdk-redb
# tree carries NO libsqlite3-sys (redb storage), so there is no
# `links = "sqlite3"` conflict with the workspace's SQLCipher, and the full
# tree type-checks in ~35s — light enough for `cargo test --workspace`.

[[bin]]
name = "sonar-cashu-cli"
path = "src/bin/sonar-cashu-cli.rs"

[dependencies]
sonar-wallet = { path = "../sonar-wallet" }
cdk = "0.17.3"
cdk-redb = "0.17.3"
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
hex.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
