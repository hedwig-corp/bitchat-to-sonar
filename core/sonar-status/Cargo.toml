[package]
name = "sonar-status"
description = "Probe Sonar systems and publish a replaceable Nostr status document for the website"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sonar-status"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "usage", "env"] }
hex.workspace = true
nostr.workspace = true
nostr-sdk.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
