name: Compose tests

# Compose Multiplatform unit tests. Runs commonTest via the JVM target, which
# needs the UniFFI bindings + host dylib that core/build-desktop.sh generates
# (Gradle wires it as :composeApp:buildDesktopRustCore). This is the cheapest
# target that compiles commonMain and executes the shared unit tests: no NDK,
# no per-ABI Android builds, and it doubles as a desktop-target compile check.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/sonar/**'
      - 'core/**'
      - '.github/workflows/compose-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/sonar/**'
      - 'core/**'
      - '.github/workflows/compose-tests.yml'

jobs:
  test:
    name: Compose unit tests (JVM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Compose resource loading (getString) initializes AWT, which throws
      # HeadlessException on a bare Linux runner — so I18nLocaleResolutionTest
      # needs a display even though it asserts on plain strings. xvfb gives the
      # job a virtual one. (The Compose UI tests themselves render via skiko in
      # software and pass headless; this is only for the AWT dependency.)
      - name: Install xvfb (virtual display for AWT)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests (builds desktop Rust core + UniFFI bindings)
        # SONAR_SKIP_BLE: the sonar-ble Linux peripheral dep (bluster) does not
        # compile on current stable Rust; BLE is optional at runtime and the
        # tests don't need a radio.
        run: xvfb-run -a ./gradlew :composeApp:jvmTest --console=plain
        working-directory: apps/sonar
        env:
          SONAR_SKIP_BLE: '1'

  android-device-test:
    name: Compose device tests (Android API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android-x86_64

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          local-cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: >-
            ./gradlew :composeApp:connectedDebugAndroidTest
            -Psonar.androidDebugAbi=x86_64
            -x :composeApp:processDebugGoogleServices
            --console=plain
          working-directory: apps/sonar
        env:
          SONAR_ABIS: '-t x86_64'
          SONAR_BINDINGS_ABI: x86_64
