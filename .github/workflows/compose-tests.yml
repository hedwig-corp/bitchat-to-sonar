name: Compose tests

# Compose Multiplatform unit tests. Runs commonTest via the JVM target, which
# needs the UniFFI bindings + host dylib that core/build-desktop.sh generates
# (Gradle wires it as :composeApp:buildDesktopRustCore). This is the cheapest
# target that compiles commonMain and executes the shared unit tests: no NDK,
# no per-ABI Android builds, and it doubles as a desktop-target compile check.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/sonar/**'
      - 'packages/transcript-engine-policy/**'
      - 'packages/transcript-engine-compose/**'
      - 'packages/transcript-engine-sample/**'
      - 'packages/transcript-engine/**'
      - 'ios/localPackages/TranscriptEngine/**'
      - 'core/**'
      - '.github/workflows/compose-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/sonar/**'
      - 'packages/transcript-engine-policy/**'
      - 'packages/transcript-engine-compose/**'
      - 'packages/transcript-engine-sample/**'
      - 'packages/transcript-engine/**'
      - 'ios/localPackages/TranscriptEngine/**'
      - 'core/**'
      - '.github/workflows/compose-tests.yml'

jobs:
  test:
    name: Compose unit tests (JVM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Compose resource loading (getString) initializes AWT, which throws
      # HeadlessException on a bare Linux runner — so I18nLocaleResolutionTest
      # needs a display even though it asserts on plain strings. xvfb gives the
      # job a virtual one. (The Compose UI tests themselves render via skiko in
      # software and pass headless; this is only for the AWT dependency.)
      # libdbus-1-dev: the desktop BLE bridge (core/sonar-ble) links libdbus-sys
      # for the BlueZ backend. Installing it lets this job build the bridge for
      # real, so a Linux BLE build break is caught here instead of on a
      # developer's machine.
      - name: Install xvfb (virtual display for AWT) + BlueZ build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libdbus-1-dev pkg-config

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assert transcript-engine golden copies stay in sync
        # Canonical: packages/transcript-engine-policy/golden/*.json
        # SPM tests carry byte-identical copies for Bundle.module loading.
        run: |
          diff -u \
            packages/transcript-engine-policy/golden/open-action.json \
            ios/localPackages/TranscriptEngine/Tests/Resources/open-action.json
          diff -u \
            packages/transcript-engine-policy/golden/inset-follow.json \
            ios/localPackages/TranscriptEngine/Tests/Resources/inset-follow.json

      - name: Run JVM unit tests (builds desktop Rust core + BLE bridge + UniFFI bindings)
        # The BLE bridge is built for real here (no SONAR_SKIP_BLE) so the Linux
        # sonar-ble/bluster build stays green; the peripheral role is
        # CoreBluetooth-only, so this covers the central/scan build path.
        # Also compile/test extracted transcript-engine modules so package-only
        # PRs cannot skip the new policy/host check surfaces.
        run: >
          xvfb-run -a ./gradlew
          :transcript-engine-policy:check
          :transcript-engine-compose:compileKotlinJvm
          :transcript-engine-sample:compileKotlinJvm
          :composeApp:jvmTest
          --console=plain
        working-directory: apps/sonar

  transcript-engine-spm:
    name: TranscriptEngine SPM tests
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: swift test (macOS — policy / day sections / golden)
        working-directory: ios/localPackages/TranscriptEngine
        run: swift test

      # UIKit host + SampleChat + TranscriptOwnedInsetTests are `#if iOS` —
      # macOS `swift test` never compiles them. Compile for iphonesimulator, then
      # run TranscriptEngine-Package tests on a booted iPhone sim (Bugbot P2).
      - name: xcodebuild build (iOS Simulator — UIKit host + SampleChat)
        working-directory: ios/localPackages/TranscriptEngine
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme TranscriptEngine \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TranscriptEngineDerived" \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -scheme SampleChat \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TranscriptEngineDerived" \
            CODE_SIGNING_ALLOWED=NO

      - name: xcodebuild test (iOS Simulator — OwnedInset + package tests)
        working-directory: ios/localPackages/TranscriptEngine
        run: |
          set -euo pipefail
          UDID=$(python3 - <<'PY'
          import re, subprocess
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available"], text=True)
          for line in out.splitlines():
              if "iPhone" not in line:
                  continue
              m = re.search(r"\(([A-F0-9-]{36})\)", line)
              if m:
                  print(m.group(1))
                  break
          else:
              raise SystemExit("no available iPhone simulator")
          PY
          )
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcodebuild test \
            -scheme TranscriptEngine-Package \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/TranscriptEngineDerived" \
            CODE_SIGNING_ALLOWED=NO

  android-device-test:
    name: Compose device tests (Android API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Install Android Rust tools
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo install uniffi --version 0.31.1 --features cli --locked

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android-x86_64

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          local-cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          # Pixel 6 defaults to a 7+ GiB userdata partition, larger than the
          # free space left on a hosted runner after the NDK and system image.
          disk-size: 2048M
          script: >-
            ./gradlew :composeApp:connectedDebugAndroidTest
            -Psonar.androidDebugAbi=x86_64
            -Psonar.skipGoogleServices=true
            --console=plain
          working-directory: apps/sonar
        env:
          SONAR_ABIS: '-t x86_64'
          SONAR_BINDINGS_ABI: x86_64
