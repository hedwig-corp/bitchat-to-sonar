name: Deploy Landing Page

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'scripts/blog/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - 'scripts/blog/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do not cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Refresh the baked blog posts from Nostr so every deploy reflects the
      # latest published posts. Best-effort (Node-only, global WebSocket): if the
      # relays are unreachable it leaves the committed snapshot in place and never
      # fails the build.
      - name: Bake blog posts from Nostr
        continue-on-error: true
        # Relay WebSockets can stall past the per-relay 8s timeout in CI; cap the
        # whole bake so Pages PRs never sit for job-length on a hung socket.
        timeout-minutes: 2
        env:
          # Optional: machine-translate blog overlays after Nostr fetch.
          # Never expose the secret to pull_request builds — those run
          # PR-controlled web/scripts/*.mjs. PRs keep committed overlays;
          # main/deploy may refresh them when the secret is set.
          SONAR_BLOG_TRANSLATE_API_KEY: ${{ github.event_name != 'pull_request' && secrets.SONAR_BLOG_TRANSLATE_API_KEY || '' }}
        run: npm run fetch-blog

      - name: Web unit checks
        run: npm test

      - name: Build
        env:
          # Project sites are served from /<repo>; relative asset paths make this
          # robust, but BASE_PATH keeps absolute references correct too.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload Pages artifact
        # Only the push-to-main run needs to publish; PRs build for validation.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
