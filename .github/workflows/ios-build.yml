name: iOS build

# The iOS app has no automated floor: nothing in CI compiles
# `ios/bitchat.xcodeproj`, so a Swift-only break merges green. That is not
# hypothetical — #368 shipped a commit where the iOS half had never compiled
# (missing `import BitLogger`) and another where an FFI signature change broke
# the Apple build; both were found by hand, days apart.
#
# This job only proves the app COMPILES. It cannot catch runtime bugs — the
# launch-surface hang in #368 compiled perfectly. Catching that class needs a
# smoke launch (boot a simulator, install, assert the launch surface goes away),
# which wants a UI test target and is deliberately left as a follow-up.

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'core/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'core/**'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS app builds
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Add the iOS Rust targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      # The Rust core dominates this job; without a warm target dir every run
      # rebuilds the whole dependency graph for two Apple triples.
      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ios-core-${{ runner.os }}-${{ hashFiles('core/**/Cargo.toml') }}
          restore-keys: |
            ios-core-${{ runner.os }}-

      # Produces sonarffi.xcframework + the generated SonarFFI.swift the app
      # links. Regenerating in CI is the point: a stale checked-in binding is
      # exactly how an FFI signature change reaches main unnoticed.
      - name: Build the Rust core for iOS
        run: ./core/build-ios.sh

      # ...but regenerating also OVERWRITES the checked-in SonarFFI.swift, and
      # that checked-in file is what every local, TestFlight and App Store build
      # compiles. A binding that no longer matches the core compiles green here
      # and then fatalErrors at launch everywhere else ("UniFFI API checksum
      # mismatch"). Editing only a `///` doc comment on a `#[uniffi::export]`
      # item is enough: the comment is hashed into the checksum (#471, #607 and
      # #613 each shipped a stale binding this way). Fix: run
      # core/build-ios.sh and commit the regenerated SonarFFI.swift.
      - name: Checked-in SonarFFI.swift matches the core
        run: git diff --exit-code -- ios/localPackages/SonarCore/Sources/SonarFFI.swift

      # `CODE_SIGNING_ALLOWED=NO` keeps this credential-free — a compile check
      # must not need the signing identity or any gitignored secret. The app
      # builds without `Local.xcconfig` / `GoogleService-Info.plist`; both are
      # optional at build time and only change runtime behaviour.
      - name: xcodebuild (iOS Simulator)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/bitchat.xcodeproj \
            -scheme 'bitchat (iOS)' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      # Run the unit suite, not just compile it. Nothing in CI executed
      # `bitchatTests_iOS` before this step: a #607 test broke on iOS 26 and
      # eleven were red on main without anyone seeing it. Serial on purpose:
      # the suites share app singletons and NotificationCenter, and parallel
      # Swift Testing runs failed ten of them on timing alone. Unsigned like
      # the build above; keychain-dependent cases skip themselves.
      - name: iOS unit tests (Simulator)
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                      | select(.deviceTypeIdentifier | test("iPhone"))][0].udid')"
          test -n "$UDID" && test "$UDID" != null
          xcodebuild test \
            -project ios/bitchat.xcodeproj \
            -scheme 'bitchat (iOS)' \
            -configuration Debug \
            -destination "id=$UDID" \
            -only-testing:bitchatTests_iOS \
            -parallel-testing-enabled NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO
