name: Compose i18n

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/compose-i18n.yml"
      - "apps/sonar/composeApp/build.gradle.kts"
      - "apps/sonar/composeApp/src/commonMain/composeResources/**"
      - "apps/sonar/composeApp/src/commonMain/kotlin/chat/bitchat/sonar/screens/SonarOnboardingScreen.kt"
      - "apps/sonar/composeApp/src/jvmTest/kotlin/chat/bitchat/sonar/I18nLocaleResolutionTest.kt"
      - "ios/bitchat/Localizable.xcstrings"
      - "scripts/i18n/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/compose-i18n.yml"
      - "apps/sonar/composeApp/build.gradle.kts"
      - "apps/sonar/composeApp/src/commonMain/composeResources/**"
      - "apps/sonar/composeApp/src/commonMain/kotlin/chat/bitchat/sonar/screens/SonarOnboardingScreen.kt"
      - "apps/sonar/composeApp/src/jvmTest/kotlin/chat/bitchat/sonar/I18nLocaleResolutionTest.kt"
      - "ios/bitchat/Localizable.xcstrings"
      - "scripts/i18n/**"

jobs:
  verify:
    name: Compose i18n checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test generator
        run: python3 -m unittest discover -s scripts/i18n -p "test_*.py"

      - name: Check generated resources
        run: python3 scripts/i18n/xcstrings_to_compose.py --check

      - name: Verify Compose resource accessors
        run: >-
          ./gradlew
          :composeApp:checkI18nStringsInSync
          :composeApp:generateResourceAccessorsForCommonMain
          --no-daemon
        working-directory: apps/sonar
