name: bitchat upstream drift

# Sonar must stay byte-compatible with permissionlesstech/bitchat and
# bitchat-android. core/bitchat-protocol pins both at the revisions its vectors
# were generated from; this job turns a newer upstream codec into a visible
# failure instead of a silent assumption. Daily, on every push to main and on
# every PR that touches the crate or this check.

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "core/bitchat-protocol/**"
      - "scripts/check-bitchat-upstream-drift.sh"
      - "scripts/bitchat-vectors/**"
      - ".github/workflows/bitchat-upstream-drift.yml"
  pull_request:
    paths:
      - "core/bitchat-protocol/**"
      - "scripts/check-bitchat-upstream-drift.sh"
      - "scripts/bitchat-vectors/**"
      - ".github/workflows/bitchat-upstream-drift.yml"
  workflow_dispatch:

jobs:
  drift:
    name: Upstream codec files unchanged since the pinned revisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare upstream HEAD against the pinned codec revisions
        run: scripts/check-bitchat-upstream-drift.sh

  vectors:
    name: Vectors replay against the crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Replay the upstream-generated vectors
        run: cargo test -p bitchat-protocol
        working-directory: core

  regenerate-ios:
    name: Re-run the iOS generator at upstream HEAD and diff the vectors
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate from permissionlesstech/bitchat HEAD
        run: scripts/bitchat-vectors/regenerate.sh --only ios

  regenerate-android:
    name: Re-run the Android generator at upstream HEAD and diff the vectors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK with licenses accepted and exports
      # ANDROID_HOME / ANDROID_SDK_ROOT; android-actions/setup-android re-ran
      # `sdkmanager --licenses` interactively and failed the job.
      - name: Regenerate from permissionlesstech/bitchat-android HEAD
        run: |
          test -n "$ANDROID_HOME" || export ANDROID_HOME=/usr/local/lib/android/sdk
          scripts/bitchat-vectors/regenerate.sh --only android

  # The two reference clients against EACH OTHER: stock iOS's codec on
  # bitchat-android's committed bytes and the reverse (scripts/bitchat-vectors/
  # cross-replay.sh). Every difference must be in
  # core/bitchat-protocol/vectors/cross/ledger.json, and a ledger entry that no
  # longer reproduces (e.g. upstream fixed it) fails the job too.
  cross-ios:
    name: Stock iOS codec reads bitchat-android's bytes
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Cross-replay with the iOS observer at upstream HEAD
        run: scripts/bitchat-vectors/cross-replay.sh --only ios

  cross-android:
    name: Stock bitchat-android codec reads bitchat iOS's bytes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cross-replay with the Android observer at upstream HEAD
        run: |
          test -n "$ANDROID_HOME" || export ANDROID_HOME=/usr/local/lib/android/sdk
          scripts/bitchat-vectors/cross-replay.sh --only android
