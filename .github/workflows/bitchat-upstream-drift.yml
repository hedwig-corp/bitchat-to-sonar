name: bitchat upstream drift

# Sonar must stay byte-compatible with permissionlesstech/bitchat and
# bitchat-android. core/bitchat-protocol pins both at the revisions its vectors
# were generated from; this job turns a newer upstream codec into a visible
# failure instead of a silent assumption. Weekly, plus on every PR that touches
# the crate or this check.

on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "core/bitchat-protocol/**"
      - "scripts/check-bitchat-upstream-drift.sh"
      - ".github/workflows/bitchat-upstream-drift.yml"
  workflow_dispatch:

jobs:
  drift:
    name: Upstream codec files unchanged since the pinned revisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare upstream HEAD against the pinned codec revisions
        run: scripts/check-bitchat-upstream-drift.sh

  vectors:
    name: Vectors replay against the crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Replay the upstream-generated vectors
        run: cargo test -p bitchat-protocol
        working-directory: core

  regenerate-ios:
    name: Re-run the iOS generator at upstream HEAD and diff the vectors
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate from permissionlesstech/bitchat HEAD
        run: scripts/bitchat-vectors/regenerate.sh --only ios

  regenerate-android:
    name: Re-run the Android generator at upstream HEAD and diff the vectors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Regenerate from permissionlesstech/bitchat-android HEAD
        run: scripts/bitchat-vectors/regenerate.sh --only android
