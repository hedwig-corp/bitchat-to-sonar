name: Core tests

# The full Swift/Compose apps can't be built in CI — they link the Rust FFI as a
# gitignored xcframework / .so generated by core/build-{ios,android}.sh and not
# committed. The Rust core (sonar-core + sonar-ffi) is the real testable unit and
# builds/tests cleanly without those artifacts, so CI exercises it.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Rust core tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Run core tests
        run: cargo test --workspace
        working-directory: core

      # sonar-ble is a DETACHED workspace (its BLE deps stay out of the
      # sonar-ffi build and `cargo test --workspace` above), so it needs its own
      # invocation or it is never compiled by CI at all. Running it here on
      # macOS covers the CoreBluetooth peripheral path, which is cfg'd out on
      # Linux and would otherwise ship unbuilt; compose-tests covers the Linux
      # (BlueZ) central path.
      - name: Build + test the desktop BLE bridge (CoreBluetooth path)
        run: cargo test
        working-directory: core/sonar-ble

      - name: Test relay smoke classification
        run: scripts/smoke/test-relay-smoke-classifier.sh

  wallet-breez-island:
    # sonar-wallet-breez is excluded from the core workspace (breez ships a
    # plain-SQLite libsqlite3-sys that cannot share a cargo graph with our
    # SQLCipher one), so `cargo test --workspace` above never sees it. Build and
    # test it separately, or the Breez backend rots silently.
    name: Wallet Breez island
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Install protoc
        # tonic-build 0.8 (via breez-sdk-liquid) needs a protobuf compiler.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/sonar-wallet-breez

      - name: Run wallet island tests
        # --locked: the money-path dependency tree is pinned in the committed
        # lockfile; fail loudly on drift instead of silently re-resolving.
        run: cargo test --locked
        working-directory: core/sonar-wallet-breez
