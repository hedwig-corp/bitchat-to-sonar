name: Core and Darkmatter tests

# The production Swift/Compose apps still depend on generated legacy FFI
# artifacts. The isolated Darkmatter module can build its pinned upstream MDK
# binding from source, so it gets a dedicated Android test lane below.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Rust core tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Update Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Run core tests
        run: cargo test --workspace
        working-directory: core

  darkmatter-android:
    name: Darkmatter Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DARKMATTER_ANDROID_ABIS: arm64-v8a

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pinned Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Run Darkmatter tests
        run: ./gradlew :darkmatterApp:testDebugUnitTest --no-daemon
        working-directory: apps/sonar
