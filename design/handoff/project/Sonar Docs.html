<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonar Docs — protocol &amp; design</title>
<link rel="icon" href="sonar/brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="sonar/brand/sonar-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060809;
    --panel: #0C1013;
    --card: #12171B;
    --card2: #171D22;
    --text: #EFF3F4;
    --text2: #9AA6AB;
    --text3: #65717A;
    --hairline: rgba(255, 255, 255, 0.08);
    --hairline2: rgba(255, 255, 255, 0.05);
    --cyan: #22D3EE;
    --cyan-deep: #67E2F4;
    --cyan-fill: #1FC0DE;
    --on-cyan: #04222B;
    --cyan-soft: rgba(34, 211, 238, 0.12);
    --indigo: #7B79F7;
    --gold: #F0B03A;
    --green: #41BC76;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sidebar: 268px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Figtree', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.6;
  }
  a { color: var(--cyan-deep); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* top bar */
  nav { position: sticky; top: 0; z-index: 40; height: 61px; background: rgba(6,8,9,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--hairline); }
  .navin { display: flex; align-items: center; gap: 16px; height: 100%; padding: 0 22px; }
  .wordmark { display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
  .wordmark:hover { text-decoration: none; }
  .wordmark img { width: 27px; height: 27px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--hairline); }
  .wordmark .tag { font-size: 12px; font-weight: 600; color: var(--text3); background: var(--panel); border-radius: 6px; padding: 2px 8px; margin-left: 2px; }
  .navsp { flex: 1; }
  .navlinks { display: flex; align-items: center; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 15px; border-radius: 999px; border: none; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--text2); box-shadow: inset 0 0 0 1px var(--hairline); }
  .btn.ghost:hover { color: var(--text); text-decoration: none; }
  .btn.primary { background: var(--cyan-fill); color: var(--on-cyan); }
  .btn.primary:hover { background: var(--cyan); text-decoration: none; }
  .menubtn { display: none; width: 38px; height: 38px; border-radius: 9px; border: none; background: var(--card); color: var(--text); cursor: pointer; align-items: center; justify-content: center; }

  .layout { display: flex; align-items: flex-start; max-width: 1400px; margin: 0 auto; }

  /* sidebar */
  aside {
    width: var(--sidebar); flex: none; position: sticky; top: 61px;
    height: calc(100vh - 61px); overflow-y: auto;
    border-right: 1px solid var(--hairline); padding: 20px 12px 60px;
  }
  aside::-webkit-scrollbar { width: 8px; }
  aside::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }
  .docsearch { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--hairline); border-radius: 10px; padding: 9px 12px; margin: 0 6px 16px; }
  .docsearch input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 14px; }
  .docsearch input::placeholder { color: var(--text3); }
  .docsearch svg { color: var(--text3); flex: none; }
  .navgroup { margin-bottom: 18px; }
  .navgroup h4 { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text3); margin: 0 0 6px; padding: 0 12px; }
  .navitem { display: block; width: 100%; text-align: left; border: none; background: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 550; color: var(--text2); padding: 8px 12px; border-radius: 9px; line-height: 1.35; }
  .navitem:hover { background: var(--hairline2); color: var(--text); text-decoration: none; }
  .navitem.on { background: var(--cyan-soft); color: var(--cyan-deep); font-weight: 700; }
  .navitem.hidden { display: none; }

  /* content */
  main { flex: 1; min-width: 0; display: flex; }
  article { flex: 1; min-width: 0; max-width: 780px; padding: 42px 52px 120px; }
  .crumbs { font-size: 13px; color: var(--text3); margin-bottom: 8px; }
  .crumbs .gh { float: right; }
  .doc-meta { display: flex; align-items: center; gap: 10px; margin: 0 0 26px; padding-bottom: 18px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap; }
  .pill { font-size: 12px; font-weight: 650; padding: 4px 11px; border-radius: 999px; }
  .pill.cyan { background: var(--cyan-soft); color: var(--cyan-deep); }
  .pill.gold { background: rgba(240,176,58,0.14); color: var(--gold); }
  .pill.mono { font-family: var(--mono); background: var(--panel); color: var(--text2); }

  /* markdown */
  .md h1 { font-size: 33px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.12; margin: 0 0 8px; }
  .md h2 { font-size: 23px; font-weight: 750; letter-spacing: -0.015em; margin: 40px 0 12px; padding-top: 8px; scroll-margin-top: 74px; }
  .md h3 { font-size: 18px; font-weight: 700; margin: 28px 0 8px; scroll-margin-top: 74px; }
  .md h2 .anchor, .md h3 .anchor { opacity: 0; color: var(--text3); font-weight: 400; margin-left: 8px; }
  .md h2:hover .anchor, .md h3:hover .anchor { opacity: 1; }
  .md p { margin: 0 0 15px; color: #DDE3E5; }
  .md ul, .md ol { margin: 0 0 15px; padding-left: 24px; color: #DDE3E5; }
  .md li { margin: 5px 0; }
  .md li::marker { color: var(--text3); }
  .md strong { color: var(--text); font-weight: 700; }
  .md a { font-weight: 600; }
  .md code { font-family: var(--mono); font-size: 0.86em; background: var(--panel); border: 1px solid var(--hairline); border-radius: 5px; padding: 1px 6px; color: var(--cyan-deep); }
  .md pre { background: #0A0D0F; border: 1px solid var(--hairline); border-radius: 14px; padding: 16px 18px; overflow-x: auto; margin: 0 0 18px; }
  .md pre code { background: none; border: none; padding: 0; color: #C4CDD1; font-size: 13px; line-height: 1.65; display: block; }
  .md blockquote { margin: 0 0 16px; padding: 4px 16px; border-left: 3px solid var(--cyan); background: var(--cyan-soft); border-radius: 0 10px 10px 0; color: var(--text2); }
  .md blockquote p:last-child { margin-bottom: 0; }
  .md hr { border: none; border-top: 1px solid var(--hairline); margin: 30px 0; }
  .md table { width: 100%; border-collapse: collapse; margin: 0 0 20px; font-size: 14px; display: block; overflow-x: auto; }
  .md th, .md td { text-align: left; padding: 9px 13px; border: 1px solid var(--hairline); vertical-align: top; }
  .md th { background: var(--panel); font-weight: 700; color: var(--text); white-space: nowrap; }
  .md td { color: var(--text2); }
  .md tr:nth-child(even) td { background: var(--hairline2); }
  .md td code, .md th code { white-space: nowrap; }

  /* on-this-page */
  .toc { width: 210px; flex: none; position: sticky; top: 61px; align-self: flex-start; max-height: calc(100vh - 61px); overflow-y: auto; padding: 46px 22px 60px; }
  .toc h5 { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text3); margin: 0 0 12px; }
  .toc a { display: block; font-size: 13px; color: var(--text3); padding: 5px 0 5px 12px; border-left: 2px solid var(--hairline); line-height: 1.4; }
  .toc a:hover { color: var(--text); text-decoration: none; }
  .toc a.sub { padding-left: 24px; font-size: 12.5px; }
  .toc a.active { color: var(--cyan-deep); border-left-color: var(--cyan); }

  .docnav { display: flex; justify-content: space-between; gap: 16px; margin-top: 50px; padding-top: 22px; border-top: 1px solid var(--hairline); }
  .docnav a { flex: 1; padding: 14px 16px; border: 1px solid var(--hairline); border-radius: 14px; background: var(--card); }
  .docnav a:hover { border-color: rgba(34,211,238,0.4); text-decoration: none; }
  .docnav .lbl { font-size: 12px; color: var(--text3); display: block; }
  .docnav .ttl { font-size: 15px; font-weight: 700; color: var(--text); display: block; margin-top: 2px; }
  .docnav a.next { text-align: right; }

  .scrim { display: none; }
  @media (max-width: 1100px) { .toc { display: none; } article { max-width: none; } }
  @media (max-width: 820px) {
    aside { position: fixed; top: 61px; left: 0; z-index: 35; background: var(--bg); transform: translateX(-100%); transition: transform 0.2s; width: 300px; }
    aside.open { transform: translateX(0); }
    .menubtn { display: flex; }
    article { padding: 28px 22px 100px; }
    .scrim.open { display: block; position: fixed; inset: 61px 0 0; z-index: 34; background: rgba(0,0,0,0.5); }
  }
</style>
</head>
<body>

<nav>
  <div class="navin">
    <button class="menubtn" id="menubtn" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <a class="wordmark" href="Sonar Landing.html"><img src="sonar/brand/sonar-icon.png" alt="">sonar<span class="tag">docs</span></a>
    <div class="navsp"></div>
    <div class="navlinks">
      <a class="btn ghost" href="Sonar Landing.html">Home</a>
      <a class="btn primary" href="Sonar Prototype.html">Open the app</a>
    </div>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside id="sidebar">
    <div class="docsearch">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"></circle><path d="M15.5 15.5 20 20"></path></svg>
      <input id="docq" type="text" placeholder="Search docs…" autocomplete="off">
    </div>
    <div id="navtree"></div>
  </aside>

  <main>
    <article>
      <div class="crumbs" id="crumbs"></div>
      <div class="md" id="content"></div>
      <div class="docnav" id="docnav"></div>
    </article>
    <nav class="toc" id="toc" aria-label="On this page"></nav>
  </main>
</div>

<script src="sonar/docs-content.js"></script>
<script>
  // ── tiny markdown renderer ──────────────────────────────────────────────
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, (m,c)=>'<code>'+c+'</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,t,h)=>{
        var href = h, cls = '';
        if (/^https?:/.test(h)) cls=' target="_blank" rel="noopener"';
        else if (/\.md$/i.test(h)) { var id=h.replace(/^.*\//,'').replace(/\.md$/i,''); href='#'+id; }
        return '<a href="'+href+'"'+cls+'>'+t+'</a>';
      });
  }
  function slug(s){ return s.toLowerCase().replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-'); }

  function render(md) {
    var lines = md.replace(/\r/g,'').split('\n');
    var html = '', i = 0, toc = [];
    function flushList(){}
    while (i < lines.length) {
      var ln = lines[i];
      // code fence
      if (/^```/.test(ln)) {
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        html += '<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue;
      }
      // table
      if (/^\|/.test(ln) && i+1 < lines.length && /^\|[\s:|-]+\|?\s*$/.test(lines[i+1])) {
        var head = ln.split('|').slice(1,-1).map(function(c){return c.trim();});
        i += 2; var rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1,-1).map(function(c){return c.trim();})); i++; }
        var t = '<table><thead><tr>'+head.map(function(h){return '<th>'+inline(h)+'</th>';}).join('')+'</tr></thead><tbody>';
        t += rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';}).join('');
        html += t + '</tbody></table>'; continue;
      }
      // headings
      var h = /^(#{1,4})\s+(.*)$/.exec(ln);
      if (h) {
        var lvl = h[1].length, txt = h[2], id = slug(txt);
        if (lvl === 2 || lvl === 3) toc.push({lvl:lvl, txt:txt, id:id});
        var anc = (lvl===2||lvl===3) ? ' id="'+id+'"' : '';
        var link = (lvl===2||lvl===3) ? '<a class="anchor" href="#'+id+'">#</a>' : '';
        html += '<h'+lvl+anc+'>'+inline(txt)+link+'</h'+lvl+'>'; i++; continue;
      }
      // hr
      if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)) { html += '<hr>'; i++; continue; }
      // blockquote
      if (/^>\s?/.test(ln)) {
        var qb = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { qb.push(lines[i].replace(/^>\s?/,'')); i++; }
        html += '<blockquote>'+render(qb.join('\n'))+'</blockquote>'; continue;
      }
      // lists
      if (/^\s*[-*+]\s+/.test(ln) || /^\s*\d+\.\s+/.test(ln)) {
        var ordered = /^\s*\d+\.\s+/.test(ln); var items = [];
        while (i < lines.length && (/^\s*[-*+]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i]))) {
          items.push(lines[i].replace(/^\s*(?:[-*+]|\d+\.)\s+/,'')); i++;
        }
        html += (ordered?'<ol>':'<ul>')+items.map(function(it){return '<li>'+inline(it)+'</li>';}).join('')+(ordered?'</ol>':'</ul>');
        continue;
      }
      // blank
      if (/^\s*$/.test(ln)) { i++; continue; }
      // paragraph
      var pb = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4}\s|```|>\s?|\||\s*[-*+]\s|\s*\d+\.\s)/.test(lines[i]) && !/^(-{3,})\s*$/.test(lines[i])) {
        pb.push(lines[i]); i++;
      }
      if (pb.length) html += '<p>'+inline(pb.join(' '))+'</p>';
    }
    render._toc = toc;
    return html;
  }

  // ── app ──────────────────────────────────────────────────────────────────
  var GROUPS = window.SONAR_DOCS.groups;
  var DOCS = window.SONAR_DOCS.docs;
  var order = [];
  GROUPS.forEach(function(g){ g.items.forEach(function(id){ order.push(id); }); });

  var navtree = document.getElementById('navtree');
  GROUPS.forEach(function(g){
    var el = document.createElement('div'); el.className = 'navgroup';
    el.innerHTML = '<h4>'+g.name+'</h4>';
    g.items.forEach(function(id){
      var d = DOCS[id]; if (!d) return;
      var b = document.createElement('a'); b.className = 'navitem'; b.href = '#'+id;
      b.textContent = d.title; b.dataset.id = id;
      b.dataset.search = (d.title + ' ' + (d.blurb||'')).toLowerCase();
      el.appendChild(b);
    });
    navtree.appendChild(el);
  });

  var contentEl = document.getElementById('content');
  var crumbsEl = document.getElementById('crumbs');
  var tocEl = document.getElementById('toc');
  var docnavEl = document.getElementById('docnav');

  function groupOf(id){ for (var k=0;k<GROUPS.length;k++){ if (GROUPS[k].items.indexOf(id)>=0) return GROUPS[k].name; } return ''; }

  function show(id) {
    var d = DOCS[id]; if (!d) { id = order[0]; d = DOCS[id]; }
    contentEl.innerHTML = render(d.md);
    var pills = '';
    if (d.status) pills += '<span class="pill gold">'+d.status+'</span>';
    if (d.kind) pills += '<span class="pill mono">'+d.kind+'</span>';
    crumbsEl.innerHTML = '<span>Docs · '+groupOf(id)+'</span>'+
      '<a class="gh" href="'+d.gh+'" target="_blank" rel="noopener">View on GitHub ↗</a>';
    // meta row under h1
    var h1 = contentEl.querySelector('h1');
    if (h1 && pills) { var mr = document.createElement('div'); mr.className='doc-meta'; mr.innerHTML = pills; h1.insertAdjacentElement('afterend', mr); }
    // toc
    var toc = render._toc || [];
    if (toc.length > 1) {
      tocEl.innerHTML = '<h5>On this page</h5>'+toc.map(function(t){return '<a class="'+(t.lvl===3?'sub':'')+'" href="#'+t.id+'">'+t.txt+'</a>';}).join('');
    } else { tocEl.innerHTML = ''; }
    // prev/next
    var idx = order.indexOf(id); docnavEl.innerHTML = '';
    if (idx > 0) { var p = DOCS[order[idx-1]]; docnavEl.innerHTML += '<a class="prev" href="#'+order[idx-1]+'"><span class="lbl">← Previous</span><span class="ttl">'+p.title+'</span></a>'; }
    else { docnavEl.innerHTML += '<span></span>'; }
    if (idx < order.length-1) { var n = DOCS[order[idx+1]]; docnavEl.innerHTML += '<a class="next" href="#'+order[idx+1]+'"><span class="lbl">Next →</span><span class="ttl">'+n.title+'</span></a>'; }
    // active nav
    [].forEach.call(document.querySelectorAll('.navitem'), function(b){ b.classList.toggle('on', b.dataset.id===id); });
    document.querySelector('article').scrollTop = 0;
    window.scrollTo(0,0);
    closeSidebar();
    setupScrollSpy();
  }

  function setupScrollSpy() {
    var links = [].slice.call(tocEl.querySelectorAll('a'));
    if (!links.length) return;
    var heads = links.map(function(a){ return document.getElementById(a.getAttribute('href').slice(1)); }).filter(Boolean);
    function onScroll(){
      var top = window.scrollY + 90; var cur = heads[0];
      heads.forEach(function(h){ if (h.offsetTop <= top) cur = h; });
      links.forEach(function(a){ a.classList.toggle('active', cur && a.getAttribute('href').slice(1)===cur.id); });
    }
    window.removeEventListener('scroll', window.__spy);
    window.__spy = onScroll; window.addEventListener('scroll', onScroll); onScroll();
  }

  // search filter
  var docq = document.getElementById('docq');
  docq.addEventListener('input', function(){
    var q = docq.value.trim().toLowerCase();
    [].forEach.call(document.querySelectorAll('.navgroup'), function(g){
      var any = false;
      [].forEach.call(g.querySelectorAll('.navitem'), function(b){
        var hit = !q || b.dataset.search.indexOf(q) >= 0;
        b.classList.toggle('hidden', !hit); if (hit) any = true;
      });
      g.style.display = any ? '' : 'none';
    });
  });

  // routing
  function fromHash(){ var id = location.hash.slice(1); show(DOCS[id] ? id : order[0]); }
  window.addEventListener('hashchange', fromHash);

  // mobile sidebar
  var sidebar = document.getElementById('sidebar'), scrim = document.getElementById('scrim');
  function closeSidebar(){ sidebar.classList.remove('open'); scrim.classList.remove('open'); }
  document.getElementById('menubtn').onclick = function(){ sidebar.classList.toggle('open'); scrim.classList.toggle('open'); };
  scrim.onclick = closeSidebar;

  fromHash();
</script>
</body>
</html>
