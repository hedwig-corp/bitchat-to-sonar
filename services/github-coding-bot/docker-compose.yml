name: sonar-hermes-github

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: hermes_github
      POSTGRES_USER: hermes_github
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes_github -d hermes_github"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  sandbox-image:
    image: ${WORKER_IMAGE:-sonar-hermes-github-sandbox:local}
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: "no"

  mcp:
    image: sonar-hermes-github-mcp:local
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://hermes_github:${POSTGRES_PASSWORD}@postgres:5432/hermes_github
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      WORKER_IMAGE: ${WORKER_IMAGE:-sonar-hermes-github-sandbox:local}
      WORKER_NETWORK: bridge
    stdin_open: true
    group_add:
      - ${DOCKER_GID:-0}
    volumes:
      - ${GITHUB_PRIVATE_KEY_FILE:?set GITHUB_PRIVATE_KEY_FILE in .env}:/run/secrets/github-app.pem:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

volumes:
  postgres-data:
